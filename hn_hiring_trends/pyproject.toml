[project]
name = "hn-hiring-trends"
version = "0.1.0"
description = "Inspectable historical analysis of Hacker News hiring advertisements"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "matplotlib>=3.10,<4"]

[project.scripts]
hn-hiring = "hn_hiring_trends.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
